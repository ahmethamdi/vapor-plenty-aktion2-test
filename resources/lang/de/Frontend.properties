erfolg = Dein Gratis-Geschenk liegt im Warenkorb.
fehlerNichtVerfuegbar = Dieses Geschenk ist zurzeit nicht verfügbar.
fehlerFremderGutschein = Aktion nicht mit anderen Gutscheinen kombinierbar. Bitte entferne zuerst den Gutschein.
fehlerNichtBerechtigt = Für das Gratis-Geschenk fehlen noch Liquids im Warenkorb.
fehlerGeraetImWarenkorb = Dieses Gerät liegt bereits im Warenkorb. Bitte wähle eine andere Farbe.
fehlerHinzufuegen = Das Geschenk konnte nicht hinzugefügt werden. Bitte versuche es erneut.
fehlerGutschein = Das Geschenk konnte gerade nicht gratis gestellt werden und wurde nicht hinzugefügt.
fehlerAllgemein = Etwas ist schiefgelaufen. Bitte lade die Seite neu.
warenkorbAngepasst = Dein Warenkorb wurde an die Aktionsbedingungen angepasst. Bitte prüfe ihn und schicke die Bestellung erneut ab.
