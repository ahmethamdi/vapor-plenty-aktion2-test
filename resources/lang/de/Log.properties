keineAenderung = Keine Änderung nötig.
aktionInaktiv = Aktion inaktiv: Geschenk und/oder Aktions-Gutschein wurden entfernt.
keineBerechtigung = Kunde darf nicht teilnehmen (Testmodus): Geschenk und/oder Aktions-Gutschein wurden entfernt.
geschenkZeileFehlt = Geschenk-Position liegt nicht mehr im Warenkorb: Geschenk vergessen.
geschenkNichtMehrErlaubt = Geschenk gehört nicht mehr zu einer erlaubten Gruppe (Konfiguration geändert): entfernt.
zuWenigArtikel = Zu wenige Aktions-Artikel: Geschenk und Aktions-Gutschein wurden entfernt.
fremderGutscheinGeschenkEntfernt = Fremder Gutschein im Warenkorb: Geschenk wurde entfernt (fremder Gutschein bleibt).
gutscheinCodeFehlt = Für die Geschenk-Gruppe ist kein Gutscheincode konfiguriert: Geschenk entfernt.
mengeKorrigiert = Menge der Geschenk-Position wurde auf 1 gesetzt.
gutscheinNachgesetzt = Aktions-Gutschein wurde (erneut) eingelöst.
gutscheinOhneGeschenk = Aktions-Gutschein ohne Geschenk/Berechtigung im Warenkorb: entfernt.
geschenkGewaehlt = Kunde hat ein Geschenk gewählt (Position + Gutschein im Warenkorb).
geschenkVomKundenEntfernt = Kunde hat das Geschenk entfernt.
wahlAbgelehnt = Geschenkauswahl abgelehnt.
optionUngueltig = Gewählte Variation ist keine gültige Geschenk-Option (nicht aktiv, nicht sichtbar, nicht verkäuflich oder nicht konfiguriert).
hinzufuegenFehlgeschlagen = Geschenk-Variation konnte nicht hinzugefügt werden.
gutscheinOhneWirkung = Aktions-Gutschein wurde nicht übernommen oder ergibt keinen Rabatt (Kampagne aktiv? Mandant? Artikel-Filter? Festbetrag?).
gutscheinFehlgeschlagenGeschenkEntfernt = Aktions-Gutschein konnte nicht eingelöst werden: Geschenk wurde wieder entfernt.
katalogFehler = Geschenk-Optionen konnten nicht geladen werden.
fehler = Unerwarteter Fehler im Plugin (Warenkorb bleibt unverändert).
