titel = Aktion: Kaufe :anzahl ELFA Pods und erhalte 1 ELFA Basisgerät gratis
intro = Lege mindestens :anzahl ELFA Pods (2er Packs, Sorten frei mischbar) in den Warenkorb und wähle danach dein Gratis ELFA Basisgerät.
nochFehlend = Noch :fehlt ELFA Pods bis zu deinem Gratis-Gerät.
nochFehlendEins = Noch 1 ELFA Pod bis zu deinem Gratis-Gerät.
fortschritt = :menge/:anzahl ELFA Pods im Warenkorb
berechtigt = Wähle dein Gratis ELFA Basisgerät (Akkuträger ohne Pod):
auswahlPlatzhalter = Farbe wählen
hinzufuegen = Gratis-Gerät in den Warenkorb
hinzufuegenKurz = Hinzufügen
deinGeschenk = Dein Gratis ELFA Basisgerät liegt im Warenkorb:
gratis = Gratis
aendern = Andere Farbe wählen
farbeTauschen = Farbe tauschen
entfernen = Entfernen
abbrechen = Abbrechen
fremderGutschein = Die Aktion ist nicht mit Gutscheinen kombinierbar. Bitte entferne zuerst den Gutschein aus dem Warenkorb.
andereAktion = Nicht mit anderer Aktion kombinierbar: In deinem Warenkorb liegt bereits ein Gratis-Geschenk aus einer anderen Aktion. Pro Bestellung gilt nur eine Aktion.
keineOptionen = Zurzeit ist leider kein ELFA Basisgerät lieferbar.
hinweis = Max. :max Gratis-Gerät pro Bestellung. Nicht mit Gutscheinen oder anderen Aktionen kombinierbar.
rechtlich = Nur für Erwachsene ab 18 Jahren. ELFA Pods enthalten Nikotin: einen Stoff, der sehr stark abhängig macht.
zumWarenkorb = Zum Warenkorb
laden = Wird hinzugefügt …
erfolg = Dein Gratis ELFA Basisgerät liegt im Warenkorb.
fehlerKeineFarbe = Bitte wähle eine Farbe.
fehlerNichtVerfuegbar = Diese Farbe ist zurzeit nicht verfügbar. Bitte wähle eine andere.
fehlerFremderGutschein = Die Aktion ist nicht mit Gutscheinen kombinierbar. Bitte entferne zuerst den Gutschein.
fehlerAndereAktion = Nicht mit anderer Aktion kombinierbar. Entferne zuerst das Gratis-Geschenk der anderen Aktion.
fehlerNichtBerechtigt = Für das Gratis-Gerät brauchst du mindestens :anzahl ELFA Pods im Warenkorb.
fehlerHinzufuegen = Das Gratis-Gerät konnte nicht in den Warenkorb gelegt werden. Bitte versuche es erneut.
fehlerGutschein = Das Gerät konnte gerade nicht gratis gestellt werden und wurde nicht hinzugefügt.
fehlerAllgemein = Etwas ist schiefgelaufen. Bitte lade die Seite neu.
warenkorbAngepasst = Dein Warenkorb wurde an die Bedingungen der Aktion „ELFA Basisgerät gratis“ angepasst. Bitte prüfe ihn und schicke die Bestellung erneut ab.
