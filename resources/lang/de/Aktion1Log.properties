keineAenderung = Aktion 1: keine Änderung nötig.
a1AktionInaktiv = Aktion 1 inaktiv oder ohne Gutscheincode: Gratis-Gerät und/oder Aktion-1-Gutschein wurden entfernt.
a1KeineBerechtigung = Aktion 1: Kunde darf nicht teilnehmen (Testmodus): Gratis-Gerät und/oder Gutschein wurden entfernt.
a1GeschenkZeileFehlt = Aktion 1: Geräte-Position liegt nicht mehr im Warenkorb: Geschenk vergessen.
a1GeschenkNichtMehrErlaubt = Aktion 1: Gerät gehört nicht mehr zu den Geschenk-Artikeln (Konfiguration geändert): entfernt.
a1ZuWenigPods = Aktion 1: zu wenige ELFA Pods: Gratis-Gerät und Gutschein wurden entfernt.
a1FremderGutscheinGeschenkEntfernt = Aktion 1: anderer Gutschein im Warenkorb: Gratis-Gerät wurde entfernt (anderer Gutschein bleibt).
a1GutscheinNachgesetzt = Aktion 1: Gutschein wurde (erneut) eingelöst.
a1GutscheinOhneGeschenk = Aktion 1: Gutschein ohne Gratis-Gerät/Berechtigung im Warenkorb: entfernt.
a1GeschenkGewaehlt = Aktion 1: Kunde hat ein Gratis-Gerät gewählt (Position + Gutschein im Warenkorb).
a1GeschenkVomKundenEntfernt = Aktion 1: Kunde hat das Gratis-Gerät entfernt.
a1WahlAbgelehnt = Aktion 1: Auswahl abgelehnt.
a1OptionUngueltig = Aktion 1: gewählte Variation ist keine gültige Geräte-Option (nicht aktiv, nicht sichtbar, nicht verkäuflich oder nicht konfiguriert).
a1HinzufuegenFehlgeschlagen = Aktion 1: Gerät konnte nicht hinzugefügt werden.
a1GutscheinOhneWirkung = Aktion 1: Gutschein nicht übernommen oder ohne Rabatt (Kampagne aktiv? Mandant? Filter? Festbetrag?).
a1GutscheinFehlgeschlagenGeschenkEntfernt = Aktion 1: Gutschein konnte nicht eingelöst werden: Gerät wurde wieder entfernt.
a1KatalogFehler = Aktion 1: Geräte-Optionen konnten nicht geladen werden.
a1Fehler = Aktion 1: unerwarteter Fehler im Plugin (Warenkorb bleibt unverändert).
